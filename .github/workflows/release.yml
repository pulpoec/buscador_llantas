name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -m1 '^ \* Version:' buscador_llantas/buscador-llantas.php | sed 's/^ \* Version: //')
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match plugin version $PLUGIN_VERSION"
            exit 1
          fi

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build
          cp -R buscador_llantas build/buscador_llantas
          cd build
          zip -r ../buscador_llantas.zip buscador_llantas

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: buscador_llantas.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
